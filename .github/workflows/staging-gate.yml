name: staging-gate

# PPT Stage 7: merge to main can prepare staging. Production stays a human gate.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  staging-readiness:
    name: Staging readiness (no production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Jira key on the merge commit
        run: |
          set -euo pipefail
          MSG="$(git log -1 --pretty=%B)"
          echo "$MSG"
          echo "$MSG" | grep -Eq 'GG-[0-9]+' || {
            echo "::error::main commits must include a Jira key (GG-n)."
            exit 1
          }
      - name: Record staging candidate
        run: |
          echo "Staging candidate only."
          echo "Would deploy Cloud Run / Functions / App Engine here when GCP secrets exist."
          echo "Production deploy, rollback, and secrets remain Level 5 — human approval required."
